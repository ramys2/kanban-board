<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand" aria-label="Kanban Board">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span>Kanban</span>
      </div>

      <label class="board-name-wrap">
        <span class="sr-only">Board name</span>
        <input id="board-name" class="board-name" type="text" maxlength="100" value="My Board" autocomplete="off">
      </label>

      <div class="header-actions">
        <button id="new-board" class="button button-quiet" type="button">New board</button>
        <button id="load-board" class="button button-quiet" type="button">Load</button>
        <button id="save-board" class="button button-primary" type="button">Save JSON</button>
        <input id="file-input" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <main class="workspace">
      <div id="board" class="board" aria-label="Kanban columns"></div>
      <button id="add-column" class="add-column" type="button">
        <span aria-hidden="true">＋</span> Add column
      </button>
    </main>

    <dialog id="task-dialog" class="task-dialog">
      <form id="task-form" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Task details</p>
            <h2 id="task-dialog-title">Add task</h2>
          </div>
          <button id="close-dialog" class="icon-button" type="button" aria-label="Close task editor">×</button>
        </div>

        <label class="field">
          <span>Title</span>
          <input id="task-title" name="title" type="text" maxlength="160" required autocomplete="off">
        </label>

        <label class="field">
          <span>Description <small>optional</small></span>
          <textarea id="task-description" name="description" rows="5" maxlength="2000"></textarea>
        </label>

        <fieldset class="color-field">
          <legend>Color <small>optional</small></legend>
          <div id="color-options" class="color-options"></div>
        </fieldset>

        <div class="dialog-actions">
          <button id="delete-task" class="button button-danger" type="button">Delete task</button>
          <span class="dialog-spacer"></span>
          <button id="cancel-task" class="button button-quiet" type="button">Cancel</button>
          <button class="button button-primary" type="submit">Save task</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <template id="column-template">
      <section class="column" draggable="true">
        <header class="column-header">
          <span class="drag-handle" title="Drag to reorder" aria-hidden="true">⠿</span>
          <input class="column-name" type="text" maxlength="80" aria-label="Column name">
          <span class="task-count" aria-label="Task count"></span>
          <button class="column-menu-button icon-button" type="button" aria-label="Column actions">•••</button>
          <div class="column-menu" hidden>
            <button class="delete-column" type="button">Delete column</button>
          </div>
        </header>
        <div class="task-list"></div>
        <button class="add-task" type="button"><span aria-hidden="true">＋</span> Add task</button>
      </section>
    </template>

    <template id="task-template">
      <article class="task" draggable="true" tabindex="0">
        <span class="task-color" aria-hidden="true"></span>
        <h3 class="task-title"></h3>
        <p class="task-description"></p>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
